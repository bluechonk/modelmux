# modelmux 桌面壳打包配置（electron-builder）
#
# 选型依据见 .planning/2026-10-26-desktop-app-selection/（Phase 4/5）：
# - NSIS 安装器（per-user 免管理员）+ 绿色便携 zip（win-unpacked 目录打包）
# - v1 不签名（signExecutable: false）：未签名首次运行走 SmartScreen
#   「更多信息 → 仍要运行」；开放分发后再接 Azure Artifact Signing
# - asar 关闭：网关静态文件服务（fs 流式读 ui/）对 asar 内路径支持有限，
#   解包目录形态让网关代码零改动

appId: cn.modelmux.desktop
productName: modelmux
# 打包二进制源（npmmirror 国内镜像）由 desktop/.npmrc 承载：
#   electron_mirror                 → npm install 时下载 electron 二进制
#   electron_builder_binaries_mirror → electron-builder 下载 7z/winCodeSign/nsis 等
# electron-builder 26 起不接受 electronGet / env 根配置项，.npmrc 是唯一稳定载体；
# 镜像在项目内自包含：队友拉下来直接 npm run pack，不依赖代理与本机 export。
# electron-updater 的更新源（latest.yml 随产物生成；v1 不接 updater UI，配置先就位）
publish:
  provider: github
  owner: bluechonk
  repo: modelmux
asar: false
directories:
  output: release
files:
  - dist/main.cjs
  - dist/gateway.cjs
  - dist/ui/**/*
  - dist/models/**/*
  - dist/icon.png
  - package.json

win:
  # 图标：exe 资源用不透明深底版（rcedit 丢 alpha，透明版会变黑方块）；
  # 应用图标（任务栏/标题栏）由 main.ts 的 BrowserWindow icon 用透明 PNG（Chromium 渲染）
  icon: resources/icon.ico
  # v1 不签名：只跳签名，保留图标与版本元数据写入
  signExecutable: false
  target:
    - target: nsis
      arch: [x64]
    # ⚠ 不做 electron-builder 的 portable target：那是「自解压单 exe」——
    # 每次运行把整个目录解压到 %TEMP% 再启动（体积大、启动慢）。
    # 便携形态改为【绿色便携】：scripts/pack.mjs 把 win-unpacked 目录打成
    # modelmux portable <版本>.zip，解压即用（工业界常用方案）。

# 产物文件名：安装器带 Setup（一眼区分）。
# 顶层 artifactName 只接受字符串（26 起不支持按 target 的对象），按 target 配在这里。
nsis:
  artifactName: "modelmux Setup ${version}.${ext}"
  # 一键安装（electron-builder 推荐默认形态）：无向导页、无「所有用户」选项 ——
  # 直接装到 %LOCALAPPDATA%\Programs\modelmux，全程无 UAC 提升。
  # assisted 形态（oneClick: false）在 GUI 下会经 UAC 提权路径，实测本机写
  # uninstallerIcon.ico 失败（报错「不能打开要写入的文件」）；一键安装绕开该路径。
  oneClick: true
  perMachine: false
  unicode: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: modelmux
  # ⚠ 已移除 installerIcon / uninstallerIcon 自定义图标：
  # 一键安装(oneClick)下自定义 uninstallerIcon 会触发 NSIS「不能打开要写入的文件:
  # ...uninstallerIcon.ico」写盘失败（实测）。不写则默认用 win.icon，绕开该坑。
