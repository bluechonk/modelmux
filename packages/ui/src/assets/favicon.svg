<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="modelmux">
  <title>modelmux</title>
  <desc>多渠道路由网关：鲸鱼身 + 分叉尾鳍，尾鳍两股即多条渠道。</desc>
  <defs>
    <linearGradient id="whale" x1="4" y1="6" x2="21" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7d92ff" />
      <stop offset="1" stop-color="#3a55d9" />
    </linearGradient>
  </defs>
  <!-- 鲸身：圆头朝左，尾柄收到右侧 -->
  <path
    d="M4.2 12.4C4.2 9 6.9 6.5 10.3 6.5c3.6 0 6.5 2.7 6.5 6.1 0 3.3-2.8 5.7-6.4 5.7-3.5 0-6.2-2.5-6.2-5.9Z"
    fill="url(#whale)"
  />
  <!-- 尾鳍：上下两股分叉，呼应「多渠道」 -->
  <path
    d="M16.4 12.2c1.6-1 3.2-2.6 3.9-4.5.2-.6.9-.5 1 .1.3 2.1-.3 3.8-1.4 4.9 1.1 1 1.7 2.7 1.4 4.8-.1.6-.8.7-1 .1-.7-1.9-2.3-3.4-3.9-4.4Z"
    fill="#6b83ff"
    opacity="0.9"
  />
  <!-- 眼睛 -->
  <circle cx="8.8" cy="10.9" r="0.95" fill="#131313" />
</svg>
