# dsh acp profile → modelmux 测试覆盖补丁
# 语义：--patch 对同 id config 深合并（key 级替换），acp 节点只覆盖 provider/model 两个 key。
#       llm-pi-ai 节点必须写全 provider（api/baseURL/apiKeyEnv/models 缺一不可）。
# 用法：见 .tmp/mx-acp-test.mjs 文件头
- id: llm-pi-ai
  config:
    providers:
      modelmux:
        displayName: modelmux
        apiKeyEnv: MODELMUX_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:4412/v1
        retryPolicy:
          mode: normal
          maxRetries: 3
          retryableCodes:
            - SERVER
            - TIMEOUT
            - TRANSPORT
          backoff:
            initialDelayMs: 1000
            maxDelayMs: 10000
            jitterRatio: 0.2
        models:
          - id: catpaw/longcat-2.0
            name: LongCat 2.0 (catpaw, free)
            contextWindow: 1000000
            input:
              - text
- id: acp
  config:
    provider: modelmux
    model: catpaw/longcat-2.0
