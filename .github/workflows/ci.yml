# CI：与本地推送门禁同一条命令（npm test = build + 全部校验器 + 全部测试）。
#
# 推送前**必须**先在本地跑通同一命令（`npm run gate`，见 AGENTS.md「推送门禁」）——
# 它会在**干净 clone** 里复现本 workflow 的全部步骤，避开开发工作树的残留状态。
# 这里跑在 ubuntu-latest：verify:commits 需要完整 git 历史（故下方 fetch-depth: 0）、
# npm ci 装的是平台原生依赖 —— 开发机上的残留状态不代表这里会绿。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 测试只需要读仓库
permissions:
  contents: read

# 同一分支/PR 的旧运行自动取消，避免连续推送堆积
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# push 事件里 verify:commits 用「上一次 main 的 SHA..本次 SHA」校验被推送的提交；
# pull_request 事件用 PR_BASE..PR_HEAD **逐条扫 PR 内的全部提交**——squash 只在 main 留
# 标题+描述，但 PR 页面每条提交都永久保留并映射协作者，只查描述会漏（PR #349 事故）。
#
# PR_TITLE / PR_BODY：squash 会把 PR 描述并入 main 上的 commit body，但那只在合并后
# 发生 —— 不在这里提前校验，就无法在合并前发现 emoji / 对话式内容（PR #349 事故）。
env:
  GITHUB_EVENT_BEFORE: ${{ github.event.before }}
  PR_BASE: ${{ github.event.pull_request.base.sha }}
  PR_HEAD: ${{ github.event.pull_request.head.sha }}
  PR_TITLE: ${{ github.event.pull_request.title }}
  PR_BODY: ${{ github.event.pull_request.body }}

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
        # verify:commits 校验全部提交历史，浅克隆会漏 —— 与本地行为对齐
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 测试（build + 校验器 + 全部测试）
        run: npm test
