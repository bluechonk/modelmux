# CI：与本地 WSL 门禁同一条命令（npm test = build + 全部校验器 + 全部测试）。
#
# ⚠ 推送前**必须**先在本地 WSL 跑通同一命令（`npm run gate`，见 AGENTS.md「本地 WSL 门禁」）。
# 本机是 Windows + Git Bash，而这里跑在 ubuntu-latest：verify:commits 需要完整 git 历史
# （故下方 fetch-depth: 0）、npm ci 装的是平台原生依赖、/mnt/c 有 DrvFs 符号链接问题 ——
# Windows 侧「跑绿了」不代表这里会绿。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 测试只需要读仓库
permissions:
  contents: read

# 同一分支/PR 的旧运行自动取消，避免连续推送堆积
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# push 事件里 verify:commits 用「上一次 main 的 SHA..本次 SHA」校验被推送的提交；
# pull_request 事件该值为空，脚本会回落到 origin/main..HEAD。
env:
  GITHUB_EVENT_BEFORE: ${{ github.event.before }}

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.filter.outputs.pages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: 判断是否涉及 Pages 产物
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "pages=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$base" HEAD -- packages/ui .github/workflows/pages.yml scripts/verify-pages-artifact.mjs; then
            echo "pages=false" >> "$GITHUB_OUTPUT"
          else
            echo "pages=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
        # verify:commits 校验全部提交历史，浅克隆会漏 —— 与本地行为对齐
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 测试（build + 校验器 + 全部测试）
        run: npm test

  pages:
    name: Pages artifact
    needs: changes
    if: needs.changes.outputs.pages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 构建 UI 演示产物
        run: DEMO=1 npm run build --workspace=packages/ui
      - name: 补 SPA 回退
        run: cp packages/ui/dist/index.html packages/ui/dist/404.html
      - name: 禁用 Jekyll
        run: touch packages/ui/dist/.nojekyll
      - name: 校验 Pages 产物
        run: node scripts/verify-pages-artifact.mjs packages/ui/dist
